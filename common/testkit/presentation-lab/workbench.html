<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentation Lab</title><link rel="stylesheet" href="/common/workbench.css"></head><body>
<header><div><span class="eyebrow">PRESENTATION LAB / <b id="game"></b></span><h1 id="heading">帧间显微镜</h1><p>真实绘制提交与固定 60 Hz 逻辑分开观察。</p></div><pre id="build"></pre></header>
<section class="setup"><button id="boot" class="primary">启动实验</button><label id="dataLabel">选择 DATA<input id="data" type="file" accept=".dat"></label><label>导入 Replay<input id="replay" type="file" accept=".rpy,.rpyx"></label><span id="status">准备中…</span></section>
<main><section class="panel viewer"><div class="section"><h2>游戏画面</h2><span id="window">未采样</span></div><div class="controls"><button id="play" disabled>继续游玩</button><button id="inspect" class="primary" disabled>冻结并检查</button><button id="step" disabled>推进 1 帧</button><button id="step10" disabled>推进 10 帧</button></div><div id="viewport"><button id="fullscreen" title="全屏（Alt+Enter）">⛶</button><iframe id="runtime" allow="autoplay; fullscreen"></iframe></div><label class="slider">帧间进度 α <output id="alphaValue">1.00</output><input id="alpha" type="range" min="0" max="1" step="0.01" value="1" disabled></label><div class="controls"><button id="scan" disabled>扫描 180 帧</button><button id="frames" disabled>保存事件＋画面</button><button id="export" disabled>导出会话</button></div></section>
<section class="panel"><div class="section"><h2>对象与证据</h2></div><div class="metrics"><div><b id="observed">—</b><span>观察对象</span></div><div><b id="suspects">—</b><span>问题组</span></div></div><div id="health">未采样；不会把未覆盖对象算作通过。</div><div class="table"><table><thead><tr><th>对象</th><th>结论</th><th>属性</th></tr></thead><tbody id="rows"><tr><td colspan="3">等待冻结检查</td></tr></tbody></table></div><pre id="detail">点击对象查看字段证据。</pre><details><summary>覆盖范围</summary><pre id="coverage">{}</pre></details></section></main>
<footer>诊断结论只覆盖实际出现且已接入观察的对象；状态证据不完整时明确显示 unknown。</footer><script type="module" src="/common/workbench.mjs"></script></body></html>
