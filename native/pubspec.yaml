name: touhouonline
description: TouhouOnline native launcher
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  archive: ^4.7.1
  audioplayers: ^6.8.1
  collection: ^1.19.1
  country_flags: ^4.1.2
  crypto: ^3.0.8
  cupertino_icons: 2.0.0
  cupertino_ui: ^1.1.7
  file_picker: ^13.4.1
  file_saver: ^0.7.0
  fl_chart: 1.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_inappwebview: 6.2.0-beta.3
  flutter_localizations:
    sdk: flutter
  flutter_midi_command: 1.4.0
  flutter_secure_storage: ^11.2.0
  flutter_webrtc: ^1.6.3
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  just_gamepads: ^0.1.1
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  prism_ui:
    git:
      url: https://github.com/chen08209/prism_ui.git
      ref: cae9a43572bddb9b20b9350ef7fde3f434a758c7
  shared_preferences: ^2.5.6
  super_sliver_list: ^0.4.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  window_manager: 0.7.1
  wolt_modal_sheet: ^0.12.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/game_catalog.json
    - assets/keyboard_layouts.json
    - assets/gamepad_defaults.json
    - assets/th09_local_inputs.json
    - assets/th09-portraits/
    - assets/touch_layout_catalog.json
    - assets/book-covers/
    - assets/quick-chat/
    - assets/launcher-wordmark-dark.png
    - assets/launcher-wordmark-light.png
