name: CI
'on':
  push:
    branches: [main]
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-history:
    name: Source history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - run: python3 tools/ports/check-history.py --base "$EAGLER_CI_BASE" --changed-subtrees --jobs 4
      env:
        EAGLER_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: node tools/ports/sync.mjs status th12 --all
  scope:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.scope.outputs.affected }}
      checkout: ${{ steps.scope.outputs.checkout }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        sparse-checkout: 'tools/ci

          launcher/config'
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: node --test tools/ci/affected-components.test.mjs
    - id: scope
      run: node tools/ci/affected-components.mjs
      env:
        EAGLER_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  frontend:
    name: Frontend
    needs: scope
    if: ${{ needs.scope.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: |
          launcher
          common
          tools/browser
          tools/testing
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: launcher/.bun-version
    - run: bun run install:locked
    - run: bun run lint
    - run: bun run i18n:check
    - run: bun run typecheck
    - run: >-
        bun --bun run vitest run --project unit
        tests/react-main/startup.test.mjs
        tests/react-main/player-keyboard.test.mjs
        tests/react-main/cloud-save-sync.test.mjs
        tests/react-main/quick-chat-model.test.mjs
    defaults:
      run:
        working-directory: launcher
  source-publication:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm run docs:check
    - run: node launcher/scripts/audit-publication.mjs --workspace
  source-contracts:
    needs: scope
    if: ${{ needs.scope.outputs.affected != '["launcher"]' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: |
          ${{ needs.scope.outputs.checkout }}
          ports/th05
          ports/th05-mp
          ports/th06
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: node tools/ci/validate-source-entries.mjs
      env:
        EAGLER_CI_AFFECTED: ${{ needs.scope.outputs.affected }}
    - run: node --test tools/build/compiler-arguments.test.mjs tools/build/source-dependencies.test.mjs tools/build/source-object.test.mjs tools/build/runtime-inputs.test.mjs tools/ci/runtime-source-owner.test.mjs tools/ci/reviewed-publication-assets.test.mjs
  common_ci_native:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
        sparse-checkout: 'common

          tools/build

          ports/th08/web/cpp/sdl

          ports/th08-mp/web/cpp/sdl

          ports/th10/web/cpp/sdl

          ports/th10-mp/web/cpp/sdl

          ports/th11/web/cpp/sdl

          ports/th11-mp/web/cpp/sdl

          ports/th15/web/cpp/sdl

          ports/th15-mp/web/cpp/sdl'
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Configure
      run: cmake -S . -B build -DEAGLER_COMMON_BUILD_TESTS=ON
    - name: Build
      run: cmake --build build --config Release --parallel
    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure
    needs:
    - scope
    if: ${{ contains(fromJSON(needs.scope.outputs.affected), 'common') }}
    name: common / native
    defaults:
      run:
        working-directory: common
    env:
      EAGLER_COMMON_ROOT: ${{ github.workspace }}/common
      EAGLER_COMMON_NETPLAY_ROOT: ${{ github.workspace }}/common
  checks:
    name: Checks
    if: ${{ always() }}
    needs:
    - source-history
    - source-publication
    runs-on: ubuntu-latest
    steps:
    - name: Require Git and documentation checks
      env:
        EAGLER_CHECKS_PASSED: ${{ needs.source-history.result == 'success' && needs.source-publication.result == 'success' }}
      run: test "$EAGLER_CHECKS_PASSED" = true
  relay:
    name: services/relay
    needs:
    - scope
    if: ${{ contains(fromJSON(needs.scope.outputs.affected), 'services/relay') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: 'services/relay

          common/contracts

          tools/testing'
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci --ignore-scripts
    - run: npm test
    - run: npm run build
    - run: npm run package -- artifacts/package
    - run: npm --prefix artifacts/package ci --omit=dev --ignore-scripts
    - run: node tests/test-netplay-relay-product-policy.mjs
      env:
        EAGLER_TEST_RELAY_PATH: artifacts/package/server/netplay-relay.mjs
    defaults:
      run:
        working-directory: services/relay
  telemetry:
    name: services/telemetry
    needs:
    - scope
    if: ${{ contains(fromJSON(needs.scope.outputs.affected), 'services/telemetry') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: 'services/telemetry

          common/contracts'
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm test
    defaults:
      run:
        working-directory: services/telemetry
  turn:
    name: services/turn
    needs:
    - scope
    if: ${{ contains(fromJSON(needs.scope.outputs.affected), 'services/turn') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: 'services/turn

          common/contracts

          tools/testing'
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: node scripts/check.mjs
    defaults:
      run:
        working-directory: services/turn

  resource-router:
    name: services/resource-router
    needs: [scope]
    if: ${{ contains(fromJSON(needs.scope.outputs.affected), 'services/resource-router') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: services/resource-router
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm test
      working-directory: services/resource-router
