<html lang="zh-CN">
<head>

  <style id="siteTheme">:root,html[data-book-theme='dark'] {
  --ui-safe-top:env(safe-area-inset-top,0px);--ui-safe-right:env(safe-area-inset-right,0px);--ui-safe-bottom:env(safe-area-inset-bottom,0px);--ui-safe-left:env(safe-area-inset-left,0px);
  color-scheme:dark;
  --kit-background:#17181b;--kit-foreground:#ececef;--kit-card:#1f2024;--kit-popover:#25262b;
  --kit-primary:#e5e5e9;--kit-primary-foreground:#232428;--kit-secondary:#303137;
  --kit-muted:#26272c;--kit-muted-foreground:#b0b0b9;--kit-accent:#303138;
  --kit-destructive:#f09a9d;--kit-destructive-foreground:#232428;--kit-border:#37383f;--kit-input:#47484f;--kit-ring:#a8a9b4;
  --kit-success:#8ed3aa;--kit-warning:#e5bd7f;
  --kit-brand:#e4868e;--kit-font:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;
}
html[data-book-theme='light'] {
  color-scheme:light;
  --kit-background:#f7f7f8;--kit-foreground:#27272d;--kit-card:#ffffff;--kit-popover:#ffffff;
  --kit-primary:#34353d;--kit-primary-foreground:#ffffff;--kit-secondary:#eeeeF1;
  --kit-muted:#f2f2f4;--kit-muted-foreground:#66666f;--kit-accent:#eaeaf0;
  --kit-destructive:#ae2939;--kit-destructive-foreground:#ffffff;--kit-border:#e1e1e6;--kit-input:#d3d3db;--kit-ring:#8b8b9c;
  --kit-success:#247044;--kit-warning:#855914;
  --kit-brand:#a93648;
}
:root,html[data-book-theme='light'],html[data-book-theme='dark'] {
  --kit-seat-loading:#ad6024;--kit-seat-unready:#bd4438;--kit-seat-ready:#00836f;
  --kit-seat-foreground:#fff;--kit-seat-watermark:#141413;
  --kit-seat-ring-ready:#b7e9a7;--kit-seat-ring-loading:#f0ca56;
  --book-bg:var(--kit-background);--book-surface:var(--kit-card);--book-raised:var(--kit-muted);
  --book-ink:var(--kit-foreground);--book-muted:var(--kit-muted-foreground);--book-border:var(--kit-border);
  --book-accent:var(--kit-primary);--book-accent-soft:var(--kit-accent);--book-on-accent:var(--kit-primary-foreground);
  --ui-font:var(--kit-font);
  --ui-layer-overlay:100;--ui-layer-dialog:101;--ui-layer-popup:110;--ui-layer-transient:300;
  --book-overlay:color-mix(in srgb,var(--kit-background) 94%,transparent);
  --book-shadow:0 8px 28px #0002;
}
</style>
  <style>
    *{box-sizing:border-box}html{background:var(--kit-background);scrollbar-gutter:stable}body{margin:0;min-height:100vh;background:var(--kit-background);color:var(--kit-foreground);font:400 14px/1.6 var(--kit-font)}

    .content{display:grid;gap:16px;max-width:760px}.origin{padding:12px 16px;border:1px solid var(--kit-border);border-radius:8px;background:var(--kit-muted);color:var(--kit-muted-foreground);font-size:12px;overflow-wrap:anywhere}.origin strong{color:var(--kit-foreground)}
    .route,.grid,.conflicts{padding:20px;border:1px solid var(--kit-border);border-radius:8px;background:var(--kit-card)}.section-title{margin:0 0 16px;font-size:16px;font-weight:600}.address-grid{display:grid;gap:12px}.address-field{display:grid;gap:6px;font-size:13px}.address-field b{font-weight:500}.address-field small,.edge-note,.fineprint{color:var(--kit-muted-foreground);font-size:12px;line-height:1.65}.address-field input{width:100%;min-width:0;min-height:40px;padding:8px 10px;border:1px solid var(--kit-input);border-radius:6px;background:var(--kit-background);color:var(--kit-foreground);font:inherit}

    .grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;font-size:13px}.grid span{color:var(--kit-muted-foreground)}.grid strong{font-weight:500}.status{padding:12px 16px;border:1px solid var(--kit-border);border-radius:6px;background:var(--kit-card);color:var(--kit-muted-foreground);font-size:13px}.status.ok{color:var(--kit-success)}.status.bad{color:var(--kit-destructive);border-color:var(--kit-destructive)}
    progress{display:block;width:100%;height:6px;border:0;border-radius:99px;overflow:hidden;background:var(--kit-muted);accent-color:var(--kit-brand)}progress::-webkit-progress-bar{background:var(--kit-muted)}progress::-webkit-progress-value{background:var(--kit-brand)}progress::-moz-progress-bar{background:var(--kit-brand)}.conflicts h2{margin:0;font-size:16px}.conflicts p{font-size:12px;color:var(--kit-muted-foreground)}.conflict-list{display:grid;gap:8px}.conflict-option{display:flex;gap:10px;align-items:flex-start;padding:10px 0}.conflict-option span{display:grid;gap:3px}.conflict-option input{margin-top:5px;accent-color:var(--kit-brand)}.conflict-option small{color:var(--kit-muted-foreground)}
    details{border-top:1px solid var(--kit-border);color:var(--kit-muted-foreground)}summary{padding:12px 0;cursor:pointer;font-size:12px}pre{margin:0;padding-bottom:14px;max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace}[hidden]{display:none!important}
    body[data-side='https'] .content,body[data-side='receiver'] .content{max-width:620px}body[data-side='https'] :is(.origin,.grid,.status,progress,.actions,.fineprint,details){display:none!important}body[data-side='https'] .status.bad{display:block!important}body[data-side='http'] .route{display:none!important}body[data-side='receiver'] :is(.route,.origin,.grid,.fineprint,details){display:none!important}
    @media(max-width:780px),(pointer:coarse){.shell{padding:16px}.hero{padding-bottom:18px;margin-bottom:18px}.hero h1{font-size:24px}.route,.grid,.conflicts{padding:16px}.address-field input{min-height:44px;font-size:16px}button,a.button{min-height:44px}.brand img{width:156px}.mode-row{gap:12px}.mode-badge{font-size:11px}}

  const LEGACY_LOCAL_STORAGE_KEYS = new Set(["eagler.mpSpectatorRail.mobilePosition.v1"]);
  const ownedLocalStorageKey = key => !key.startsWith("eagler-touhou-origin-migration-") &&
    (key.startsWith("eagler-") || LEGACY_LOCAL_STORAGE_KEYS.has(key));
  const randomNonce = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, "0")).join("");

  function setSide(side, badge, hint, heading = "存档恢复") {

    document.title = `${heading} ~ EAGLER TOUHOU`;
  }

  function normalizeMigrationPage(raw, protocol) {
    let text = String(raw || "").trim();
    if (!text) throw new Error(`请输入 ${protocol === "http:" ? "旧 HTTP" : "新 HTTPS"} 地址`);
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(text)) text = `${protocol}//${text}`;
    const url = new URL(text, location.href);
    if (url.protocol !== protocol) throw new Error(`${protocol === "http:" ? "旧站" : "新站"}地址必须使用 ${protocol}//`);
    url.username = "";
    url.password = "";
    url.search = "";
    url.hash = "";
    if (url.pathname.endsWith("/")) url.pathname += "migrate.html";
    else if (!url.pathname.endsWith("/migrate.html")) {
      const tail = url.pathname.slice(url.pathname.lastIndexOf("/") + 1);
      if (tail.includes(".")) url.pathname = `${url.pathname.slice(0, url.pathname.lastIndexOf("/") + 1)}migrate.html`;
      else url.pathname += "/migrate.html";
    }
    return url;
  }

  function inferredHttpsTarget() {
    const target = new URL(location.href);
    target.protocol = "https:";
    if (target.port === "80") target.port = "";
    target.search = "";
    target.hash = "";
    return target;
  }

  function inferredHttpSource() {
    const source = new URL(location.href);
    source.protocol = "http:";
    if (source.port === "443") source.port = "";
    source.search = "";
    source.hash = "";
    return source;
  }

  function migrationTarget() {
    return normalizeMigrationPage(targetAddress.value || params.get("target") || inferredHttpsTarget().href, "https:");
  }

  function legacyHttpSource() {
    return normalizeMigrationPage(sourceAddress.value || inferredHttpSource().href, "http:");
  }

  async function openExistingDatabase(name) {
    return new Promise((resolve, reject) => {
      let absent = false;
      const req = indexedDB.open(name);
      req.onupgradeneeded = event => {
        if (event.oldVersion === 0) {
          absent = true;
          req.transaction.abort();
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => absent ? resolve(null) : reject(req.error || new Error(`无法打开 ${name}`));
    });
  }

  function dbSchema(db) {
    const stores = [];
    for (const name of db.objectStoreNames) {
      const store = db.transaction(name, "readonly").objectStore(name);
      const indexes = [];
      for (const indexName of store.indexNames) {
        const index = store.index(indexName);
        indexes.push({ name: index.name, keyPath: index.keyPath, unique: index.unique, multiEntry: index.multiEntry });
      }
      stores.push({ name, keyPath: store.keyPath, autoIncrement: store.autoIncrement, indexes });
    }
    return { name: db.name, version: db.version, stores };
  }

  async function countDatabase(name) {
    const db = await openExistingDatabase(name);
    if (!db) return { name, records: 0, present: false };
    let records = 0;
    for (const storeName of db.objectStoreNames) records += await request(db.transaction(storeName, "readonly").objectStore(storeName).count());
    db.close();
    return { name, records, present: true };
  }

  async function scan() {
    const local = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && ownedLocalStorageKey(key)) local.push([key, localStorage.getItem(key)]);
    }
    const dbs = [];
    for (const name of DATABASES) dbs.push(await countDatabase(name));
    const cachesFound = [];
    if (globalThis.caches?.keys) {
      for (const name of await caches.keys()) {
        if (!CACHE_NAMES.has(name)) continue;
        const cache = await caches.open(name);
        cachesFound.push({ name, entries: (await cache.keys()).length });
      }
    }
    inventory = { local, dbs, caches: cachesFound };
    const saves = dbs.filter(item => item.name.startsWith("/savesth")).reduce((sum, item) => sum + item.records, 0);
    const installed = dbs.find(item => item.name === "eagler-touhou-package-store-v1")?.records || 0;
    const legacy = dbs
      .filter(item => item.name === "EM_PRELOAD_CACHE" || item.name === "eagler-touhou-local-assets-v1")
      .reduce((sum, item) => sum + item.records, 0) + cachesFound.reduce((sum, item) => sum + item.entries, 0);
    document.getElementById("lsCount").textContent = `${local.length} 项`;
    document.getElementById("saveCount").textContent = `${saves} 条记录`;
    document.getElementById("packageCount").textContent = `${installed} 条记录`;
    document.getElementById("legacyCount").textContent = `${legacy} 项`;
    return inventory;
  }

  async function scanTarget() {
    const local = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && ownedLocalStorageKey(key)) local.push(key);
    }
    const dbs = [];
    for (const name of DATABASES) dbs.push(await countDatabase(name));
    const cachesFound = [];
    if (globalThis.caches?.keys) {
      for (const name of await caches.keys()) {
        if (!CACHE_NAMES.has(name)) continue;
        const cache = await caches.open(name);
        cachesFound.push({ name, entries: (await cache.keys()).length });
      }
    }
    const records = dbs.reduce((sum, item) => sum + item.records, 0);
    const cacheEntries = cachesFound.reduce((sum, item) => sum + item.entries, 0);
    return { localKeys: local, records, cacheEntries, databases: dbs, caches: cachesFound };
  }

  function summarizeInventory(value) {
    return {
      localKeys: value.local.map(([key]) => key),
      databases: value.dbs.filter(item => item.records > 0).map(item => ({ name: item.name, records: item.records })),
      caches: value.caches.filter(item => item.entries > 0).map(item => ({ name: item.name, entries: item.entries })),
    };
  }

  function deleteDatabase(name) {
    return new Promise((resolve, reject) => {
      const requestDelete = indexedDB.deleteDatabase(name);
      requestDelete.onsuccess = () => resolve();
      requestDelete.onerror = () => reject(requestDelete.error || new Error(`无法清空 ${name}`));
      requestDelete.onblocked = () => reject(new Error(`${name} 正被其它页面使用，请关闭其它 EAGLER TOUHOU 标签页后重试`));
    });
  }

  async function prepareSelectedOverwrites(plan) {
    for (const db of receiverDbs.values()) db.close();
    receiverDbs.clear();
    for (const name of plan.overwriteDatabases) await deleteDatabase(name);
    if (globalThis.caches?.keys) {
      for (const name of plan.overwriteCaches) await caches.delete(name);
    }
  }

  function normalizeInventorySummary(value) {
    if (!value || typeof value !== "object") throw new Error("旧站迁移摘要无效");
    const localKeys = Array.isArray(value.localKeys)
      ? [...new Set(value.localKeys.filter(key => typeof key === "string" && ownedLocalStorageKey(key)))]
      : [];
    const databases = Array.isArray(value.databases) ? value.databases
      .filter(item => item && DATABASES.has(item.name) && Number.isSafeInteger(item.records) && item.records > 0)
      .map(item => ({ name: item.name, records: item.records })) : [];
    const cachesFound = Array.isArray(value.caches) ? value.caches
      .filter(item => item && CACHE_NAMES.has(item.name) && Number.isSafeInteger(item.entries) && item.entries > 0)
      .map(item => ({ name: item.name, entries: item.entries })) : [];
    return { localKeys, databases, caches: cachesFound };
  }

  function requestSourceInventory(timeout = 20000) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => finish(new Error("旧站没有返回迁移摘要")), timeout);
      const finish = (error = null, value = null) => {
        clearTimeout(timer);
        window.removeEventListener("message", listener);
        if (error) reject(error); else resolve(value);
      };
      const listener = event => {
        const message = event.data;
        if (event.source !== peer || event.origin !== peerOrigin || message?.protocol !== PROTOCOL || message.nonce !== nonce || message.type !== "inventory-summary") return;
        try { finish(null, normalizeInventorySummary(message.inventory)); }
        catch (error) { finish(error); }
      };
      window.addEventListener("message", listener);
      post({ type: "inventory-request" });
    });
  }

  function chooseMigrationPlan(sourceSummary, targetSummary) {
    const targetLocalKeys = new Set(targetSummary.localKeys);
    const targetDatabases = new Map(targetSummary.databases.map(item => [item.name, item.records]));
    const targetCaches = new Map(targetSummary.caches.map(item => [item.name, item.entries]));
    const localConflicts = sourceSummary.localKeys.filter(key => targetLocalKeys.has(key));
    const databaseConflicts = sourceSummary.databases.filter(item => (targetDatabases.get(item.name) || 0) > 0);
    const cacheConflicts = sourceSummary.caches.filter(item => (targetCaches.get(item.name) || 0) > 0);
    const conflictCount = (localConflicts.length ? 1 : 0) + databaseConflicts.length + cacheConflicts.length;
    const basePlan = {
      allowedDatabases: sourceSummary.databases.map(item => item.name),
      allowedCaches: sourceSummary.caches.map(item => item.name),
      skipLocalStorageKeys: [],
      overwriteDatabases: [],
      overwriteCaches: [],
    };
    if (!conflictCount) return Promise.resolve(basePlan);

    conflictList.textContent = "";
    conflictList.className = "conflict-list";
    const addOption = (kind, name, label, detail) => {
      const row = document.createElement("label");
      row.className = "conflict-option";
      const input = document.createElement("input");
      input.type = "checkbox";
      input.dataset.kind = kind;
      input.dataset.name = name;
      const copy = document.createElement("span");
      const title = document.createElement("strong");
      title.textContent = label;
      const small = document.createElement("small");
      small.textContent = detail;
      copy.append(title, small);
      row.append(input, copy);
      conflictList.append(row);
    };
    if (localConflicts.length) {
      addOption("local", "localStorage", "网站设置", `${localConflicts.length} 个同名设置。勾选后使用旧站值；未勾选则保留新站值。`);
    }
    for (const item of databaseConflicts) {
      addOption("database", item.name, DATABASE_LABELS.get(item.name) || item.name,
        `旧站 ${item.records} 条，新站 ${targetDatabases.get(item.name)} 条。勾选后只替换这一项。`);
    }
    for (const item of cacheConflicts) {
      addOption("cache", item.name, CACHE_LABELS.get(item.name) || item.name,
        `旧站 ${item.entries} 项，新站 ${targetCaches.get(item.name)} 项。勾选后只替换这个缓存。`);
    }
    conflictPanel.hidden = false;
    overwriteTarget.hidden = false;
    setStatus("检测到新旧站数据冲突。请勾选确实要用旧站版本覆盖的项目；不勾选的项目会保留新站版本。", "bad");

    return new Promise(resolve => {
      overwriteTarget.onclick = () => {
        const plan = {
          ...basePlan,
          allowedDatabases: [...basePlan.allowedDatabases],
          allowedCaches: [...basePlan.allowedCaches],
          skipLocalStorageKeys: localConflicts.length ? [...localConflicts] : [],
          overwriteDatabases: [],
          overwriteCaches: [],
        };
        for (const input of conflictList.querySelectorAll("input[type=checkbox]")) {
          const { kind, name } = input.dataset;
          if (kind === "local") {
            if (input.checked) plan.skipLocalStorageKeys = [];
          } else if (kind === "database") {
            if (input.checked) plan.overwriteDatabases.push(name);
            else plan.allowedDatabases = plan.allowedDatabases.filter(value => value !== name);
          } else if (kind === "cache") {
            if (input.checked) plan.overwriteCaches.push(name);
            else plan.allowedCaches = plan.allowedCaches.filter(value => value !== name);
          }
        }
        overwriteTarget.disabled = true;
        resolve(plan);
      };
    });
  }

  function transferables(value, output = new Set()) {
    if (value instanceof ArrayBuffer) output.add(value);
    else if (ArrayBuffer.isView(value)) output.add(value.buffer);
    else if (value && typeof value === "object" && !(value instanceof Blob) && !(value instanceof Date)) {
      for (const child of Array.isArray(value) ? value : Object.values(value)) transferables(child, output);
    }
    return [...output];
  }

  function post(message, transfers = []) {
    peer.postMessage({ protocol: PROTOCOL, nonce, ...message }, peerOrigin, transfers);
  }

  function send(message, transfers = [], timeout = 30000) {
    const id = `${Date.now().toString(36)}-${++serial}`;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { pending.delete(id); reject(new Error(`${message.type} 等待接收端超时`)); }, timeout);
      pending.set(id, { resolve, reject, timer });
      post({ ...message, id }, transfers);
    });
  }

  function resolveAck(message) {
    const item = pending.get(message.replyTo);
    if (!item) return;
    clearTimeout(item.timer); pending.delete(message.replyTo);
    if (message.ok) item.resolve(message); else item.reject(new Error(message.error || "接收端写入失败"));
  }

  async function prepareTargetDatabase(schema) {
    let db = await openExistingDatabase(schema.name);
    if (!db) {
      db = await new Promise((resolve, reject) => {
        const req = indexedDB.open(schema.name, schema.version);
        req.onupgradeneeded = () => {
          const created = req.result;
          for (const definition of schema.stores) {
            const store = created.createObjectStore(definition.name, { keyPath: definition.keyPath, autoIncrement: definition.autoIncrement });
            for (const index of definition.indexes) store.createIndex(index.name, index.keyPath, { unique: index.unique, multiEntry: index.multiEntry });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error(`无法创建 ${schema.name}`));
        req.onblocked = () => reject(new Error(`${schema.name} 被其它游戏页面占用，请先关闭其它 EAGLER TOUHOU 标签页`));
      });
    }
    if (db.version !== schema.version) throw new Error(`${schema.name} 数据库版本不一致（旧站 ${schema.version} / HTTPS ${db.version}）`);
    for (const definition of schema.stores) {
      if (!db.objectStoreNames.contains(definition.name)) throw new Error(`${schema.name} 缺少对象仓库 ${definition.name}`);
      const store = db.transaction(definition.name, "readonly").objectStore(definition.name);
      if (JSON.stringify(store.keyPath) !== JSON.stringify(definition.keyPath) || store.autoIncrement !== definition.autoIncrement) {
        throw new Error(`${schema.name}/${definition.name} schema 不兼容`);
      }
    }
    receiverDbs.set(schema.name, db);
  }

  async function putTargetRecord(message) {
    const db = receiverDbs.get(message.database);
    if (!db) throw new Error(`数据库尚未准备：${message.database}`);
    const tx = db.transaction(message.store, "readwrite");
    const store = tx.objectStore(message.store);
    if (store.keyPath == null) store.put(message.value, message.key); else store.put(message.value);
    await txDone(tx);
  }

  function rewriteCacheUrl(url, sourceOrigin) {
    const parsed = new URL(url);
    if (parsed.origin !== sourceOrigin) return parsed.href;
    return new URL(`${parsed.pathname}${parsed.search}`, location.origin).href;
  }

  async function putTargetCacheRecord(message, sourceOrigin) {
    const cache = await caches.open(message.cache);
    const url = rewriteCacheUrl(message.url, sourceOrigin);
    const req = new Request(url, { method: "GET", headers: message.requestHeaders });
    const response = new Response(message.body, {
      status: message.status,
      statusText: message.statusText,
      headers: message.responseHeaders,
    });
    await cache.put(req, response);
  }

  async function receiveMessage(event) {
    const message = event.data;
    if (!message || message.protocol !== PROTOCOL || message.nonce !== nonce || event.origin !== peerOrigin || event.source !== peer) return;
    if (message.type === "ack") { resolveAck(message); return; }
    const reply = async task => {
      try { await task(); post({ type: "ack", replyTo: message.id, ok: true }); }
      catch (error) { post({ type: "ack", replyTo: message.id, ok: false, error: error?.message || String(error) }); throw error; }
    };
    try {
      if (message.type === "local-storage") await reply(async () => {
        for (const [key, value] of message.entries) if (ownedLocalStorageKey(key) && typeof value === "string") localStorage.setItem(key, value);
      });
      else if (message.type === "db-start") await reply(() => prepareTargetDatabase(message.schema));
      else if (message.type === "db-record") await reply(() => putTargetRecord(message));
      else if (message.type === "cache-record") await reply(() => putTargetCacheRecord(message, peerOrigin));
      else if (message.type === "complete") await reply(async () => {
        localStorage.setItem("eagler-touhou-origin-migration-v1", JSON.stringify({ from: peerOrigin, at: Date.now() }));
        localStorage.removeItem(AUTH_KEY);
        for (const db of receiverDbs.values()) db.close();
        receiverDbs.clear();
        progress.value = 1;
        setStatus(`迁移完成：${message.records} 条数据库记录，${message.cacheEntries} 个缓存文件，约 ${formatBytes(message.bytes)}。`, "ok");
        const newSite = new URL("./", location.href);
        newSite.search = "";
        newSite.hash = "";
        openGame.href = newSite.href;
        openGameLabel.textContent = newSite.href;
        openGame.hidden = false;
      });
    } catch (error) {
      setStatus(`迁移失败：${error?.message || error}`, "bad");
      log(`ERROR ${error?.stack || error}`);
    }
  }

  const formatBytes = bytes => {
    if (!Number.isFinite(bytes) || bytes <= 0) return "0 B";
    const units = ["B", "KiB", "MiB", "GiB"];
    let value = bytes, index = 0;
    while (value >= 1024 && index < units.length - 1) { value /= 1024; index++; }
    return `${value.toFixed(index ? 1 : 0)} ${units[index]}`;
  };

  async function copyDatabase(name, totals) {
    const db = await openExistingDatabase(name);
    if (!db) return;
    const schema = dbSchema(db);
    await send({ type: "db-start", schema });
    log(`数据库 ${name}: ${schema.stores.length} 个 object store`);
    const storeNames = [...db.objectStoreNames];
    if (name === "eagler-touhou-package-store-v1") {
      const packageStoreOrder = new Map([["objects", 0], ["generations", 1], ["installations", 2]]);
      storeNames.sort((a, b) => (packageStoreOrder.get(a) ?? 1) - (packageStoreOrder.get(b) ?? 1));
    }
    for (const storeName of storeNames) {
      const keys = await request(db.transaction(storeName, "readonly").objectStore(storeName).getAllKeys());
      for (const key of keys) {
        const value = await request(db.transaction(storeName, "readonly").objectStore(storeName).get(key));
        const transfers = transferables(value);
        const bytes = transfers.reduce((sum, buffer) => sum + buffer.byteLength, 0);
        await send({ type: "db-record", database: name, store: storeName, key, value }, transfers, 60000);
        totals.records++; totals.bytes += bytes;
        progress.value = Math.min(.95, progress.value + .002);
      }
    }
    db.close();
  }

  async function copyCaches(totals, allowedCaches) {
    if (!globalThis.caches?.keys) return;
    for (const cacheName of await caches.keys()) {
      if (!CACHE_NAMES.has(cacheName) || !allowedCaches.has(cacheName)) continue;
      const cache = await caches.open(cacheName);
      for (const req of await cache.keys()) {
        const response = await cache.match(req);
        if (!response || response.status < 200 || response.status > 599) continue;
        const body = await response.arrayBuffer();
        const bytes = body.byteLength;
        await send({
          type: "cache-record", cache: cacheName, url: req.url,
          requestHeaders: [...req.headers], responseHeaders: [...response.headers],
          status: response.status, statusText: response.statusText, body,
        }, [body], 120000);
        totals.cacheEntries++; totals.bytes += bytes;
        log(`缓存 ${cacheName}: ${new URL(req.url).pathname} (${formatBytes(bytes)})`);
        progress.value = Math.min(.95, progress.value + .01);
      }
    }
  }

  async function runMigration() {
    migrateButton.disabled = true;
    const source = legacyHttpSource();
    const target = migrationTarget();
    if (source.origin !== location.origin) throw new Error(`当前页面是 ${location.origin}，但“旧 HTTP 地址”填的是 ${source.origin}。请先打开那个旧站后再迁移。`);
    if (target.origin === location.origin) throw new Error("目标 origin 与当前 origin 相同");
    const handoff = params.get("handoff") || "";
    if (!sameHost(location.origin, target.origin) && !handoff) {
      throw new Error("跨主机迁移必须先从新 HTTPS 页打开迁移器并显式授权旧 HTTP 地址。请先回到新 HTTPS migrate.html。 ");
    }
    nonce = randomNonce();
    target.searchParams.set("receive", nonce);
    target.searchParams.set("source", location.origin);
    if (handoff) target.searchParams.set("handoff", handoff);
    peerOrigin = target.origin;
    setStatus(`正在打开 HTTPS 接收页：${peerOrigin}`);
    const ready = new Promise((resolve, reject) => {
      let startupTimer = setTimeout(() => reject(new Error("HTTPS 接收页没有响应；请检查证书、弹窗拦截或 HTTPS 是否已上线")), 20000);
      const listener = event => {
        const message = event.data;
        if (event.source !== peer || event.origin !== peerOrigin || message?.protocol !== PROTOCOL || message.nonce !== nonce) return;
        if (message.type === "inventory-request") {
          if (startupTimer) {
            clearTimeout(startupTimer);
            startupTimer = null;
          }
          peer.postMessage({ protocol: PROTOCOL, nonce, type: "inventory-summary", inventory: summarizeInventory(inventory) }, peerOrigin);
          return;
        }
        if (message.type !== "ready") return;
        if (startupTimer) clearTimeout(startupTimer);
        window.removeEventListener("message", listener);
        resolve(message.plan || {});
      };
      window.addEventListener("message", listener);
    });
    peer = window.open(target.href, "eaglerTouhouHttpsMigration");
    if (!peer) throw new Error("浏览器阻止了 HTTPS 接收页弹窗，请允许本站弹窗后重试");
    const plan = await ready;
    window.addEventListener("message", event => {
      const message = event.data;
      if (event.source === peer && event.origin === peerOrigin && message?.protocol === PROTOCOL && message.nonce === nonce && message.type === "ack") resolveAck(message);
    });
    progress.value = .05;
    const totals = { records: 0, cacheEntries: 0, bytes: 0 };
    const skippedLocalStorage = new Set(Array.isArray(plan.skipLocalStorageKeys) ? plan.skipLocalStorageKeys : []);
    const allowedDatabases = new Set(Array.isArray(plan.allowedDatabases) ? plan.allowedDatabases : []);
    const allowedCaches = new Set(Array.isArray(plan.allowedCaches) ? plan.allowedCaches : []);
    await send({ type: "local-storage", entries: inventory.local.filter(([key]) => !skippedLocalStorage.has(key)) });
    progress.value = .1;
    for (const name of DATABASES) if (allowedDatabases.has(name)) await copyDatabase(name, totals);
    await copyCaches(totals, allowedCaches);
    await send({ type: "complete", ...totals }, [], 30000);
    localStorage.setItem("eagler-touhou-origin-migration-v1", JSON.stringify({ to: peerOrigin, at: Date.now() }));
    progress.value = 1;
    const newSite = new URL("./", target);
    newSite.search = "";
    newSite.hash = "";
    migrateButton.hidden = true;
    openGame.href = newSite.href;
    openGameLabel.textContent = newSite.href;
    openGame.hidden = false;
    setStatus(`迁移完成：${totals.records} 条数据库记录，${totals.cacheEntries} 个缓存文件，约 ${formatBytes(totals.bytes)}。下面是新的站点地址。`, "ok");
  }

  async function initReceiver() {
    nonce = params.get("receive") || "";
    peerOrigin = params.get("source") || "";
    if (!nonce || !peerOrigin || !window.opener) throw new Error("缺少存档恢复会话，请从 HTTP 旧站的 migrate.html 发起迁移");
    const source = new URL(peerOrigin);
    const standardPair = location.protocol === "https:" && source.protocol === "http:" && sameHost(peerOrigin, location.origin);
    if (!standardPair) {
      if (location.protocol !== "https:" || source.protocol !== "http:") throw new Error("HTTP/HTTPS 迁移 origin 校验失败");
      const handoff = params.get("handoff") || "";
      let authorization = null;
      try { authorization = JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch {}
      if (!handoff || !authorization || authorization.token !== handoff || authorization.sourceOrigin !== source.origin || authorization.targetOrigin !== location.origin || authorization.expires < Date.now()) {
        throw new Error("跨主机旧站没有得到当前 HTTPS 新站的显式迁移授权");
      }
    }
    peer = window.opener;
    setSide("receiver", "接收中", "正在接收旧站数据，迁移完成前请不要关闭这个页面。", "正在接收旧站数据");
    sourceAddress.value = `${source.origin}${source.pathname === "/" ? "/migrate.html" : source.pathname}`;
    targetAddress.value = new URL(location.pathname, location.origin).href;
    sourceAddress.disabled = true;
    targetAddress.disabled = true;
    openHttp.hidden = true;
    edgeNote.hidden = true;
    originLabel.textContent = "正在接收旧站数据。";
    setStatus("正在比较旧站和新站的数据…");
    targetInventory = await scanTarget();
    const sourceInventory = await requestSourceInventory();
    const plan = await chooseMigrationPlan(sourceInventory, targetInventory);
    try {
      await prepareSelectedOverwrites(plan);
    } catch (error) {
      overwriteTarget.disabled = false;
      throw error;
    }
    conflictPanel.hidden = true;
    overwriteTarget.hidden = true;
    window.addEventListener("message", receiveMessage);
    setStatus("迁移范围已确认，等待旧站发送数据…");
    post({
      type: "ready",
      plan: {
        allowedDatabases: plan.allowedDatabases,
        allowedCaches: plan.allowedCaches,
        skipLocalStorageKeys: plan.skipLocalStorageKeys,
      },
    });
  }

  function prepareSourceLink() {
    const source = legacyHttpSource();
    const target = migrationTarget();
    if (location.protocol !== "https:") throw new Error("请在 HTTPS 新站准备存档恢复地址");
    if (target.origin !== location.origin) {
      throw new Error(`当前新站是 ${location.origin}，但迁移目标变成了 ${target.origin}。请从真正的新站重新打开迁移页。`);
    }
    const token = randomNonce();
    localStorage.setItem(AUTH_KEY, JSON.stringify({ token, sourceOrigin: source.origin, targetOrigin: target.origin, expires: Date.now() + 10 * 60 * 1000 }));
    source.searchParams.set("sourceMode", "http");
    source.searchParams.set("target", target.href);
    source.searchParams.set("handoff", token);
    sourceAddress.value = source.href.replace(source.search, "");
    targetAddress.value = target.href;
    return source;
  }

  function configureHttpsHome(upgraded = false) {
    setSide("https", upgraded ? "旧站未打开" : "数据迁移", upgraded
      ? "浏览器把旧站跳回了 HTTPS。请填写能直接打开旧站的 HTTP 地址。"
      : "",
      upgraded ? "无法进入旧站" : "存档恢复");
    const source = inferredHttpSource();
    const target = params.get("target") ? normalizeMigrationPage(params.get("target"), "https:") : inferredHttpsTarget();
    sourceAddress.value = source.href;
    targetAddress.value = target.href;
    openHttp.hidden = false;
    edgeNote.hidden = !upgraded;
    migrateButton.hidden = true;
    originLabel.textContent = "";
    setStatus("");
    openHttp.onclick = () => {
      try {
        const sourceLink = prepareSourceLink();
        location.href = sourceLink.href;
      } catch (error) { setStatus(error?.message || String(error), "bad"); }
    };
  }

  async function initSender() {
    if (location.protocol === "https:") {
      configureHttpsHome(params.get("sourceMode") === "http");
      return;
    }
    if (location.protocol !== "http:") {
      setStatus("当前页面不是可用的 HTTP 旧站。", "bad");
      return;
    }
    setSide("http", "旧站", "", "存档恢复");
    sourceAddress.value = new URL(location.pathname, location.origin).href;
    targetAddress.value = params.get("target") ? normalizeMigrationPage(params.get("target"), "https:").href : inferredHttpsTarget().href;
    openHttp.hidden = true;
    edgeNote.hidden = true;
    migrateButton.hidden = false;
    originLabel.hidden = true;
    await scan();
    setStatus("扫描完成。");
    migrateButton.disabled = false;
    migrateButton.addEventListener("click", () => runMigration().catch(error => {
      migrateButton.disabled = false;
      setStatus(`迁移失败：${error?.message || error}`, "bad");
      log(`ERROR ${error?.stack || error}`);
    }));
  }

  (async () => {
    try {
      if (params.has("receive")) await initReceiver(); else await initSender();
    } catch (error) {
      setStatus(`初始化失败：${error?.message || error}`, "bad");
      log(`ERROR ${error?.stack || error}`);
    }
  })();
})();
</script>

function chooseSiteBrandFace(random=Math.random){const roll=random();return roll<.1?"face-F02B":roll<.2?"face-F055":ordinary[Math.min(ordinary.length-1,Math.floor(random()*ordinary.length))];}
function siteBrandPath(face=SITE_BRAND_DEFAULT){if(!SITE_BRAND_FACES.includes(face))throw Error("Unknown site brand character");return "assets/brand/"+face+".svg";}
function initializeStaticSiteBrand(document,moduleUrl){
  const face=chooseSiteBrandFace();
  for(const mark of document.querySelectorAll('img[data-site-brand]')){
    const fallback=mark.src;
    mark.src=new URL('../'+siteBrandPath(face),moduleUrl).href;
    mark.onerror=()=>{mark.onerror=null;mark.src=fallback;mark.dataset.brandFace=SITE_BRAND_DEFAULT;};

  }
}

initializeStaticSiteBrand(document,new URL("assets/site-brand.mjs",document.baseURI).href);})();</script>
