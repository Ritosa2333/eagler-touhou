<!doctype html>
<html lang="zh-CN" data-book-theme="light"><head><meta charset="utf-8"><title>房间界面检查 | 横竖屏</title>
<style>html,body{margin:0;background:#e7e7e7;width:max-content}nav{display:flex;align-items:center;gap:12px;padding:10px;font:13px sans-serif;background:white}button{padding:5px 12px}iframe{display:block;border:0}</style></head><body>
<nav><span>真实房间组件 | 本地示例</span><button data-view="landscape">横屏</button><button data-view="portrait">竖屏</button></nav>
<iframe title="房间组件预览" src="./room-frame.html"></iframe>
<script>const frame=document.querySelector('iframe');function view(mode){frame.width=mode==='portrait'?390:1280;frame.height=mode==='portrait'?844:720;}document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>view(button.dataset.view));view(new URLSearchParams(location.search).get('view'));</script></body></html>
