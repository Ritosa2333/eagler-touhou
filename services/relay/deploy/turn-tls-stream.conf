stream {
    server {
        listen 8443 ssl;
        ssl_certificate /etc/letsencrypt/live/touhouonline-hk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/touhouonline-hk/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        include /etc/eagler-turn-monitor/tls-target.conf;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
