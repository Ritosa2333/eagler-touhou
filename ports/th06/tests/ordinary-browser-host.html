<!doctype html>
<meta charset="utf-8">
<title>TH06 ordinary browser smoke host</title>
<iframe id="runtime" style="width:640px;height:480px;border:0"></iframe>
<pre id="status">boot</pre>
<script>
(() => {
  "use strict";
  const protocol = "eagler-touhou/1";
  const game = "th06";
  const epoch = 1;
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "replay";
  const iframe = document.getElementById("runtime");
  const status = document.getElementById("status");
  const pending = new Map();
  let request = 0;

  function send(command, body = {}) {
    const id = `ordinary-smoke-${++request}`;
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      iframe.contentWindow.postMessage({ protocol, game, epoch, command, request: id, ...body }, location.origin);
      setTimeout(() => {
        const waiter = pending.get(id);
        if (!waiter) return;
        pending.delete(id);
        reject(new Error(`${command} timeout`));
      }, 15000);
    });
  }

  window.addEventListener("message", async event => {
    if (event.source !== iframe.contentWindow || event.origin !== location.origin) return;
    const message = event.data || {};
    if (message.protocol !== protocol || message.game !== game || message.epoch !== epoch) return;
    if (message.request && pending.has(message.request)) {
      const waiter = pending.get(message.request);
      pending.delete(message.request);
      if (message.ok) waiter.resolve(message);
      else waiter.reject(new Error(message.error || "runtime request failed"));
      return;
    }
    if (message.event !== "ready") return;
    try {
      const options = { replayViewer: mode === "replay" };
      if (mode === "music-room") options.debugHarness = "music-room";
      await send("configure", {
        music: "none",
        resources: [],
        sharedResources: [{ url: "/assets/msgothic.ttc", path: "/msgothic.ttc" }],
        thpracCatalog: [],
        options,
      });
      if (mode === "replay") {
        // Package the public fixture into MEMFS before main(), matching the
        // base-package fallback used by FileSystem after the ordinary IDBFS
        // lookup. This keeps the smoke independent from prior browser saves.
        await send("resources", {
          resources: [{ url: "/__ordinary_replay_fixture.rpy", path: "/replay/th6_01.rpy" }],
        });
      }
      await send("launch");
      status.textContent = "launched";
      globalThis.__th06OrdinarySmokeLaunched = true;
    } catch (error) {
      status.textContent = `failed: ${error && error.message || error}`;
      globalThis.__th06OrdinarySmokeFailure = status.textContent;
      console.error(status.textContent);
    }
  });

  iframe.src = `/build-web-ordinary-audit-clean/th06.html?hosted=1&runtimeVariant=ordinary&runtimeEpoch=${epoch}`;
})();
</script>
