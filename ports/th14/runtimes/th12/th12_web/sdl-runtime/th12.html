<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>东方星莲船 · 网页版</title><link rel="stylesheet" href="/app/style.css"></head>
<body><main id="stage"><canvas id="canvas" width="640" height="480" tabindex="0" aria-label="东方星莲船游戏画面"></canvas><div id="touch" hidden><button id="shoot">射击</button><button id="focus">低速</button><button id="bomb">B</button><button id="pause">暂停</button></div><div id="welcome"><h1>东方星莲船</h1><p>日文原版 · C++ / SDL3 / WebGL2</p><button id="start">启动游戏</button><progress id="progress" hidden></progress><p id="status" role="status">首次加载需要下载游戏资源。</p></div><div id="pause-panel" hidden><h2>暂停</h2><button id="resume">继续游戏</button><button id="return-title">返回标题</button></div></main><footer><button id="fullscreen">全屏</button><button id="touch-toggle">显示触控</button><span id="health"></span></footer><div id="error" role="alert" hidden></div><script type="module" src="/app/shell.mjs"></script>
<script>
// `?autostart=1` starts the game without a click so the delivery harness can be
// driven headlessly (the module shell has attached its handlers by `load`).
if (new URLSearchParams(location.search).has('autostart')) {
  addEventListener('load', () => setTimeout(() => document.getElementById('start')?.click(), 0));
}
</script>
</body></html>
