<!doctype html>
<meta charset="utf-8">
<title>TH07 Phantasm ResultScreen browser smoke host</title>
<iframe id="runtime" style="width:640px;height:480px;border:0"></iframe>
<pre id="status">boot</pre>
<script>
(() => {
  "use strict";
  const protocol = "eagler-touhou/1";
  const game = "th07";
  const epoch = 1;
  const iframe = document.getElementById("runtime");
  const status = document.getElementById("status");
  const pending = new Map();
  let request = 0;

  function send(command, body = {}) {
    const id = `result-screen-phantasm-${++request}`;
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      iframe.contentWindow.postMessage(
        { protocol, game, epoch, command, request: id, ...body }, location.origin);
      setTimeout(() => {
        const waiter = pending.get(id);
        if (!waiter) return;
        pending.delete(id);
        reject(new Error(`${command} timeout`));
      }, 15000);
    });
  }

  window.addEventListener("message", async event => {
    if (event.source !== iframe.contentWindow || event.origin !== location.origin) return;
    const message = event.data || {};
    if (message.protocol !== protocol || message.game !== game || message.epoch !== epoch) return;
    if (message.request && pending.has(message.request)) {
      const waiter = pending.get(message.request);
      pending.delete(message.request);
      if (message.ok) waiter.resolve(message);
      else waiter.reject(new Error(message.error || "runtime request failed"));
      return;
    }
    if (message.event === "ready") {
      try {
        await send("configure", {
          music: "none",
          resources: [],
          sharedResources: [],
          thpracCatalog: [],
          options: { debugHarness: "result-stats-phantasm" },
        });
        await send("launch");
        globalThis.__th07PhantasmResultLaunched = true;
        status.textContent = "launched";
      } catch (error) {
        globalThis.__th07PhantasmResultFailure = String(error?.message || error);
        status.textContent = `failed: ${globalThis.__th07PhantasmResultFailure}`;
      }
      return;
    }
    if (message.event === "exit") {
      globalThis.__th07PhantasmResultExit = message.status || "unknown";
      status.textContent = `exit: ${globalThis.__th07PhantasmResultExit}`;
    }
  });

  iframe.src = `/build-web-th07-netplay-replay-audit/th07.html?hosted=1&runtimeVariant=multiplayer&runtimeEpoch=${epoch}`;
})();
</script>
