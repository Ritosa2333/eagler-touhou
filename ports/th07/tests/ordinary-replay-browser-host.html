<!doctype html>
<meta charset="utf-8">
<title>TH07 ordinary Replay browser host</title>
<iframe id="runtime" style="width:640px;height:480px;border:0"></iframe>
<pre id="status">boot</pre>
<script>
(() => {
  "use strict";
  const protocol = "eagler-touhou/1";
  const game = "th07";
  const epoch = 1;
  const iframe = document.getElementById("runtime");
  const status = document.getElementById("status");
  const pending = new Map();
  let request = 0;

  function send(command, body = {}) {
    const id = `ordinary-replay-${++request}`;
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      iframe.contentWindow.postMessage(
        { protocol, game, epoch, command, request: id, ...body }, location.origin);
      setTimeout(() => {
        const waiter = pending.get(id);
        if (!waiter) return;
        pending.delete(id);
        reject(new Error(`${command} timeout`));
      }, 15000);
    });
  }

  window.addEventListener("message", async event => {
    if (event.source !== iframe.contentWindow || event.origin !== location.origin) return;
    const message = event.data || {};
    if (message.protocol !== protocol || message.game !== game || message.epoch !== epoch) return;
    if (message.request && pending.has(message.request)) {
      const waiter = pending.get(message.request);
      pending.delete(message.request);
      if (message.ok) waiter.resolve(message);
      else waiter.reject(new Error(message.error || "runtime request failed"));
      return;
    }
    if (message.event !== "ready") return;
    try {
      await send("configure", {
        music: "none",
        resources: [],
        sharedResources: [{ url: "/assets/msgothic.ttc", path: "/msgothic.ttc" }],
        thpracCatalog: [],
        options: { replayViewer: true },
      });
      await send("resources", {
        resources: [{ url: "/__ordinary_replay_fixture.rpy", path: "/savesth07/replay/th7_01.rpy" }],
      });
      globalThis.__th07OrdinaryReplayFiles = (await send("list")).files || [];
      await send("launch");
      status.textContent = "launched";
      globalThis.__th07OrdinaryReplayLaunched = true;
    } catch (error) {
      status.textContent = `failed: ${error && error.message || error}`;
      globalThis.__th07OrdinaryReplayFailure = status.textContent;
    }
  });

  iframe.src = `/build-web-eagler-thprac/th07.html?hosted=1&runtimeVariant=ordinary&runtimeEpoch=${epoch}`;
})();
</script>
