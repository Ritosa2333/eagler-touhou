<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>東方妖々夢 〜 Perfect Cherry Blossom</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html{--touhou-canvas-width:640px;--touhou-canvas-height:480px}body{display:grid;place-items:center;touch-action:none}
    canvas{display:block;width:var(--touhou-canvas-width)!important;height:var(--touhou-canvas-height)!important;max-width:none;max-height:none;aspect-ratio:4/3;outline:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    #status{position:fixed;inset:auto 0 1rem;text-align:center;color:#ddd;font:14px sans-serif;pointer-events:none}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading…</div>
  <script>
    (() => {
      "use strict";
      const protocol = "eagler-touhou/1";
      const game = "th07";
      const params = new URLSearchParams(location.search);
      const epoch = Number(params.get("runtimeEpoch"));
      const validEpoch = Number.isSafeInteger(epoch) && epoch > 0;
      window.__eaglerRuntimeEpochV1 = validEpoch ? epoch : 0;
      const saveRoot = params.get("runtimeVariant") === "multiplayer" ? "/savesth07-multiplayer" : "/savesth07";
      const hosted = params.get("hosted") === "1" && window.parent !== window;
      window.__eaglerManagedDataState = {
        enabled: params.get("managedData") === "1" && hosted,
        game,
        generation: params.get("gameGeneration") || ""
      };
      const assetVersion = params.get("v") || "";
      const gameDataVersion = params.get("asset") || "";
      const oggAssetVersion = params.get("oggAsset") || "";
      const nativeFetch = globalThis.fetch.bind(globalThis);
      const localGameDataUrl = gameDataVersion
        ? new URL(`/.eagler-local/game-data/${game}/${encodeURIComponent(gameDataVersion)}/${game}.data`, location.origin).href
        : "";
      globalThis.fetch = async (input, init) => {
        try {
          const requestUrl = new URL(input instanceof Request ? input.url : String(input), location.href);
          const method = String(input instanceof Request ? input.method : (init?.method || "GET")).toUpperCase();
          if (localGameDataUrl && method === "GET" && requestUrl.origin === location.origin &&
              requestUrl.pathname.endsWith(`/${game}.data`) && globalThis.caches?.match) {
            const local = await caches.match(localGameDataUrl);
            if (local) return local.clone();
          }
          if (oggAssetVersion && method === "GET" && requestUrl.origin === location.origin &&
              /\/[^/]+\.ogg$/i.test(requestUrl.pathname) && globalThis.caches?.match) {
            const filename = decodeURIComponent(requestUrl.pathname.slice(requestUrl.pathname.lastIndexOf("/") + 1));
            if (/^[A-Za-z0-9_.-]+\.ogg$/.test(filename)) {
              const localOgg = new URL(`/.eagler-local/ogg/${game}/${encodeURIComponent(oggAssetVersion)}/${encodeURIComponent(filename)}`, location.origin).href;
              const local = await caches.match(localOgg);
              if (local) return local.clone();
            }
          }
        } catch {}
        return nativeFetch(input, init);
      };
      const mobileDevice = navigator.userAgentData?.mobile === true || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
      const status = document.getElementById("status");
      const containCanvasSize = (width, height) => {
        const safeWidth = Math.max(1, Math.floor(Number(width) || 0));
        const safeHeight = Math.max(1, Math.floor(Number(height) || 0));
        let cssWidth = safeWidth;
        let cssHeight = Math.floor(cssWidth * 3 / 4);
        if (cssHeight > safeHeight) {
          cssHeight = safeHeight;
          cssWidth = Math.floor(cssHeight * 4 / 3);
        }
        return { width: cssWidth, height: cssHeight };
      };
      const fitCanvasToViewport = () => {
        const root = document.documentElement;
        if (!root) return;
        const size = containCanvasSize(root.clientWidth, root.clientHeight);
        root.style.setProperty("--touhou-canvas-width", `${size.width}px`);
        root.style.setProperty("--touhou-canvas-height", `${size.height}px`);
      };
      fitCanvasToViewport();
      window.addEventListener("resize", fitCanvasToViewport, { passive: true });
      window.visualViewport?.addEventListener("resize", fitCanvasToViewport, { passive: true });
      let launched = false;
      let launchSerial = 0;
      let loadedMusicFiles = [];
      let loadedRuntimeFiles = [];
      let thpracCatalog = [];
      const failedMusicResources = new Map();
      let transfer = null;
      let baseTransfer = null;
      const reply = (request, ok, payload = {}) => {
        if (hosted) window.parent.postMessage({ protocol, game, epoch, request, ok, ...payload }, location.origin);
      };
      const emit = (event, payload = {}) => {
        if (hosted) window.parent.postMessage({ protocol, game, epoch, event, ...(event==='first-frame'?{launchSerial}:{}), ...payload }, location.origin);
      };
      globalThis.EaglerTouhouGameExited = result => {
        spectatorPlayback.stop();
        const finish = () => emit("exit", {
          status: result === 1 && !globalThis.__eaglerNetplayFailed ? "success" : "failure",
          ...(globalThis.__eaglerNetplayFailed ? {error: String(globalThis.__eaglerNetplayError || "Multiplayer connection failed")} : {})
        });
        // Flush IDBFS while the Runtime is still alive. The parent must not
        // wait for a post-mortem sync RPC after it receives exit, because the
        // main loop may already be gone and that RPC can sit until timeout.
        return sync().then(finish, error => {
          console.error("final save sync failed", error);
          finish();
        });
      };
      let runtimeInfoSent = false;
      const emitRuntimeInfo = () => {
        if (runtimeInfoSent || !hosted) return;
        runtimeInfoSent = true;
        let renderer = "WebGL";
        try {
          const sdl = Module && Module.SDL3;
          const gl = globalThis.GLctx || Module.ctx || (sdl && sdl.ctx) ||
            (Module.canvas && (Module.canvas.getContext("webgl2") || Module.canvas.getContext("webgl")));
          if (gl && typeof gl.getParameter === "function") {
            const ext = gl.getExtension("WEBGL_debug_renderer_info");
            renderer = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || renderer);
          }
        } catch {}
        emit("runtime-info", { renderer });
      };
      globalThis.EaglerTouhouFirstFrame = () => { emit("first-frame"); emitRuntimeInfo(); };
      globalThis.EaglerTouhouFrameHealth = (fps, maxGapMs) => emit("frame-health", { fps, maxGapMs });
      globalThis.EaglerTouhouAudioHealth = (queuedMs, minQueuedMs, robust) => {
        emit("audio-health", {
          queuedMs, minQueuedMs, robust: !!robust,
          backend: "script",
          underruns: 0
        });
      };
      const sync = () => new Promise((resolve, reject) => FS.syncfs(false, error => error ? reject(error) : resolve()));
      const failHostedStartup = error => {
        const message = String(error?.message || error || "Runtime startup failed");
        console.error(error);
        status.textContent = message;
        emit("error", { error: message });
      };
      const safePath = value => {
        if (typeof value !== "string" || !value || value.includes("\\")) throw new Error("invalid path");
        const parts = value.split("/");
        if (parts.some(part => !part || part === "." || part === "..")) throw new Error("invalid path");
        return `${saveRoot}/${parts.join("/")}`;
      };
      const ensureDir = path => { const slash = path.lastIndexOf("/"); if (slash > 0) FS.mkdirTree(path.slice(0, slash)); };
      const clearMusic = () => {
        for (const path of loadedMusicFiles) { try { FS.unlink(path); } catch {} }
        loadedMusicFiles = [];
      };
      const clearRuntime = () => {
        for (const path of loadedRuntimeFiles) { try { FS.unlink(path); } catch {} }
        loadedRuntimeFiles = [];
      };
      const assertStaticPackManifest = (manifest, expected) => {
        if (manifest?.schema !== "eagler-touhou/thcrap-static-pack/1" || manifest.game !== "th07" ||
            manifest.language !== expected.language || typeof manifest.runtimeVersion !== "string" ||
            !Array.isArray(manifest.files) || manifest.files.length > 256) throw new Error("invalid TH07 language pack manifest");
        for (const file of manifest.files) {
          if (typeof file?.path !== "string" || !file.path.startsWith("/thcrap/th07/") || file.path.includes("\\") || file.path.includes("..") ||
              !Number.isInteger(file.bytes) || file.bytes < 0) throw new Error("invalid TH07 language pack file");
        }
      };
      const installStaticPack = async pack => {
        if (launched) throw new Error("runtime resources cannot be changed after launch");
        if (typeof pack?.url !== "string" || typeof pack.language !== "string" ||
            !Number.isInteger(pack.bytes) || pack.bytes <= 0 ||
            !pack.manifest || !Array.isArray(pack.files)) throw new Error("invalid TH07 language pack");
        const url = new URL(pack.url, location.href);
        if (url.origin !== location.origin) throw new Error("cross-origin TH07 language pack");
        assertStaticPackManifest(pack.manifest, pack);
        const expected = new Map(pack.manifest.files.map(file => [file.path, file]));
        if (pack.files.length !== expected.size) throw new Error("TH07 language pack file count mismatch");
        const verified = [];
        for (const file of pack.files) {
          if (typeof file?.path !== "string" || !file.path.startsWith("/thcrap/th07/") || file.path.includes("\\") || file.path.includes("..") ||
              !(file.bytes instanceof Uint8Array)) throw new Error("invalid TH07 language pack path");
          const declaration = expected.get(file.path);
          if (!declaration || file.bytes.length !== declaration.bytes) throw new Error(`${file.path}: size mismatch`);
          verified.push({ path: file.path, bytes: file.bytes });
        }
        clearRuntime();
        for (const file of verified) {
          ensureDir(file.path); FS.writeFile(file.path, file.bytes, { canOwn: true }); loadedRuntimeFiles.push(file.path);
        }
      };
      const fetchResourceBytes = async (url, init = {}, callbacks = {}) => {
        const controller = new AbortController();
        const timeoutMs = 15000;
        let timer = null;
        let timedOut = false;
        const arm = () => {
          clearTimeout(timer);
          timer = setTimeout(() => { timedOut = true; controller.abort(); }, timeoutMs);
        };
        arm();
        try {
          const response = await fetch(url, { ...init, signal: controller.signal });
          if (!response.ok) throw new Error(`${url.pathname}: HTTP ${response.status}`);
          callbacks.onResponse?.(response);
          arm();
          const chunks = [];
          let received = 0;
          if (response.body?.getReader) {
            const reader = response.body.getReader();
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              arm();
              chunks.push(value); received += value.length;
              callbacks.onChunk?.(value, received);
            }
          } else {
            const value = new Uint8Array(await response.arrayBuffer());
            arm();
            chunks.push(value); received = value.length;
            callbacks.onChunk?.(value, received);
          }
          const bytes = new Uint8Array(received);
          let offset = 0;
          for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.length; }
          return { response, bytes };
        } catch (error) {
          if (timedOut || error?.name === "AbortError") throw new Error(`${url.pathname}: 15 秒内没有继续收到数据（网络 / CDN 超时）`);
          throw error;
        } finally {
          clearTimeout(timer);
        }
      };
      const installRuntime = async message => {
        if (launched) throw new Error("runtime resources cannot be changed after launch");
        if (message.runtimePack) { await installStaticPack(message.runtimePack); return; }
        const resources = message.runtimeResources ?? [];
        if (!Array.isArray(resources) || resources.length > 256) throw new Error("invalid runtime resources");
        clearRuntime();
        for (const resource of resources) {
          if (typeof resource?.url !== "string" || typeof resource.path !== "string" || !resource.path.startsWith("/thcrap/th07/") || resource.path.includes("\\") || resource.path.includes("..")) throw new Error("invalid runtime resource");
          const url = new URL(resource.url, location.href);
          if (url.origin !== location.origin) throw new Error("cross-origin runtime resource");
          const { bytes } = await fetchResourceBytes(url, { cache: "force-cache" });
          if (Number.isFinite(Number(resource.size)) && bytes.length !== Number(resource.size)) throw new Error(`${resource.path}: size mismatch`);
          ensureDir(resource.path); FS.writeFile(resource.path, bytes, { canOwn: true }); loadedRuntimeFiles.push(resource.path);
        }
      };
      const installShared = async message => {
        if (!Array.isArray(message.sharedResources) || message.sharedResources.length > 4) throw new Error("invalid shared resources");
        await Promise.all(message.sharedResources.map(async resource => {
          if (typeof resource?.url !== "string" || !["/msgothic.ttc", "/unifont.otf"].includes(resource.path)) throw new Error("invalid shared resource");
          const url = new URL(resource.url, location.href);
          if (url.origin !== location.origin) throw new Error("cross-origin shared resource");
          const { bytes } = await fetchResourceBytes(url, { cache: "force-cache" });
          FS.writeFile(resource.path, bytes, { canOwn: true });
        }));
      };
      const installPackageResources = async resources => {
        if (launched) throw new Error("resources cannot be changed after launch");
        if (!Array.isArray(resources) || resources.length > 512) throw new Error("invalid package resources");
        for (const resource of resources) {
          if (typeof resource?.url !== "string" || typeof resource?.path !== "string" || !resource.path.startsWith("/") ||
              resource.path.includes("\\") || resource.path.includes("\0") ||
              resource.path.split("/").some((part, index) => index > 0 && (!part || part === "." || part === ".."))) {
            throw new Error("invalid package resource");
          }
          const url = new URL(resource.url, location.href);
          if (url.origin !== location.origin) throw new Error("cross-origin package resource");
          const { bytes } = await fetchResourceBytes(url, { cache: "no-store" });
          ensureDir(resource.path);
          FS.writeFile(resource.path, bytes, { canOwn: true });
        }
      };
      const emitTransfer = force => {
        if (!transfer) return;
        const now = performance.now();
        if (!force && now - transfer.lastEmit < 200) return;
        transfer.lastEmit = now;
        const seconds = Math.max((now - transfer.startedAt) / 1000, 0.1);
        emit("transfer", { kind: "music", mode: transfer.mode, loaded: transfer.loaded, total: transfer.total,
          speed: transfer.loaded / seconds, completed: transfer.completed, files: transfer.files });
      };
      const downloadMusicResource = async resource => {
        if (typeof resource?.url !== "string" || typeof resource?.path !== "string" ||
            !(/^(\/bgm-ogg\/[A-Za-z0-9_.-]+|\/thbgm\.dat)$/.test(resource.path))) throw new Error("invalid music resource");
        const url = new URL(resource.url, location.href);
        if (url.origin !== location.origin) throw new Error("cross-origin music resource");
        const previous = transfer.byPath.get(resource.path) || 0;
        transfer.loaded = Math.max(0, transfer.loaded - previous);
        transfer.byPath.set(resource.path, 0);
        let received = 0;
        const { bytes } = await fetchResourceBytes(url, { cache: "force-cache" }, {
          onResponse(response) {
            const declared = Number(resource.size) || Number(response.headers.get("content-length")) || 0;
            if (!Number(resource.size) && declared) transfer.total += declared;
          },
          onChunk(value, totalReceived) {
            received = totalReceived;
            transfer.loaded += value.length;
            transfer.byPath.set(resource.path, received);
            emitTransfer(false);
          }
        });
        ensureDir(resource.path); FS.writeFile(resource.path, bytes, { canOwn: true });
        loadedMusicFiles.push(resource.path); failedMusicResources.delete(resource.path);
        transfer.completed++; emitTransfer(true);
      };
      const recordMusicFailure = (resource, error) => {
        failedMusicResources.set(resource.path, resource);
        emit("music-error", { path: resource.path, error: String(error?.message || error), failed: failedMusicResources.size });
      };
      const runMusicQueue = async resources => {
        let next = 0;
        const worker = async () => {
          while (next < resources.length) {
            const resource = resources[next++];
            try { await downloadMusicResource(resource); } catch (error) { recordMusicFailure(resource, error); }
          }
        };
        await Promise.all(Array.from({ length: Math.min(4, resources.length) }, worker));
      };
      const retryMusic = async () => {
        const resources = [...failedMusicResources.values()]; failedMusicResources.clear();
        await runMusicQueue(resources);
        if (!failedMusicResources.size) emit("music-complete", { loaded: transfer?.loaded || 0, total: transfer?.total || 0 });
      };
      // BEGIN NETPLAY PERFORMANCE PROFILE (pure function; unit tested)
      function resolveNetplayPerformanceProfile(options, coarsePointer = false) {
        const multiplayer = options.netplayMode === "lan";
        const diagnostics = options.debugHarness === "netplay-lan-stage1";
        const manual = diagnostics && options.netplayPerformanceProfile === "manual";
        const inputDelay = diagnostics ? (options.netplayInputDelayFrames ?? 0) : 0;
        const rollbackPolicy = diagnostics ? (options.netplayRollbackPolicy || "full") : "full";
        const responsive = multiplayer && inputDelay === 0 && rollbackPolicy === "full" &&
          !options.netplaySpectator && !options.replayViewer;
        const optimized = responsive && !manual;
        return {
          netplayPerformanceProfile: manual ? "manual" : "responsive",
          netplayInputDelayFrames: inputDelay,
          netplayRollbackPolicy: rollbackPolicy,
          netplayTouchDeltaPredictionFrames: options.netplayTouchDeltaPredictionFrames ?? 0,
          netplayTouchQuantization: options.netplayTouchQuantization ?? 0,
          netplayTouchEquivalentAbsorb: !!options.netplayTouchEquivalentAbsorb,
          netplayIncrementalReconcile: !!options.netplayIncrementalReconcile,
          netplayReliableInputRepair: diagnostics && options.netplayReliableInputRepair != null
            ? options.netplayReliableInputRepair : optimized,
          netplayDormantBulletElision: options.netplayDormantBulletElision === true,
          netplayInitialFrameLag: options.netplayInitialFrameLag ?? 0,
          netplayDisableTimeSyncPacing: !!options.netplayDisableTimeSyncPacing,
          netplaySnapshotPolicy: diagnostics && options.netplaySnapshotPolicy
            ? options.netplaySnapshotPolicy : (optimized ? "frontier" : "always"),
          netplaySnapshotLayout: diagnostics && options.netplaySnapshotLayout
            ? options.netplaySnapshotLayout : (optimized ? "runs" : "objects"),
          netplaySnapshotCopy: diagnostics && options.netplaySnapshotCopy
            ? options.netplaySnapshotCopy : (optimized ? "bulk" : "wasm"),
          netplaySnapshotRestore: diagnostics && options.netplaySnapshotRestore
            ? options.netplaySnapshotRestore : (optimized ? "coalesced" : "sequential"),
          // Checkpoint spacing is undo storage, NOT input buffering. The
          // repeated zero-delay 3P tests favor three ticks per checkpoint.
          netplaySnapshotCheckpointFrames: options.netplaySnapshotCheckpointFrames ?? (optimized ? 3 : 2),
          netplayBulletSnapshot: options.netplayBulletSnapshot || (optimized ? "live" : "journal"),
          // Presentation cadence is a player preference, not a netplay safety
          // mechanism. The 60 Hz simulation remains authoritative either way;
          // high-refresh displays may present interpolated frames unless the
          // shared Launcher "Lock to 60 FPS" option is explicitly enabled.
          limitPresentationTo60: !!options.limitPresentationTo60
        };
      }
      // END NETPLAY PERFORMANCE PROFILE
      const installMusic = async message => {
        if (launched) throw new Error("music cannot be changed after launch");
        const options = message.options || {};
        const netplayDiagnostics = options.debugHarness === "netplay-lan-stage1";
        if (options.netplayPerformanceProfile != null && !["responsive", "manual"].includes(options.netplayPerformanceProfile)) throw new Error("invalid netplay performance profile");
        if (!netplayDiagnostics && options.netplayPerformanceProfile === "manual") throw new Error("manual netplay profile requires the test harness");
        if (!Array.isArray(message.thpracCatalog ?? []) || (message.thpracCatalog?.length || 0) > 256) throw new Error("invalid thprac catalog");
        thpracCatalog = message.thpracCatalog ?? [];
        Module.eaglerThpracCatalog = thpracCatalog;
        for (const key of ["thpracEnabled", "limitPresentationTo60", "touchEnabled", "unlimitedTouch", "touchBombZoneEnabled", "doubleTapBombEnabled", "alwaysHitbox", "enhanceLocalPlayerVisibility", "focusHitboxEnabled", "th06FocusHitbox", "replayViewer", "netplayReplayFixtureStart", "netplayRollbackProbe", "netplayScriptedInput", "netplayReplayPlaybackCycle", "netplayPauseCycle", "netplayRestartCycle", "netplayStageTransition", "netplayStage4BossChain", "netplaySpectator", "netplayChallengeMode", "netplayTestNoRollback", "netplayTestKeepRollbackSnapshots", "netplayIncrementalReconcile", "netplayDisableTimeSyncPacing", "netplayReliableInputRepair"]) {
          if (options[key] != null && typeof options[key] !== "boolean") throw new Error("invalid eagler-touhou option");
        }
        if (options.touchSensitivity != null && (!Number.isFinite(options.touchSensitivity) || options.touchSensitivity < 100 || options.touchSensitivity > 300)) throw new Error("invalid touch sensitivity");
        if (options.touchMovementMode != null && !["joystick", "joystick-free", "touch", "touch-unlimited"].includes(options.touchMovementMode)) throw new Error("invalid touch movement mode");
        if (options.touchFocusMode != null && !["two-finger", "hold-button", "toggle-button"].includes(options.touchFocusMode)) throw new Error("invalid touch focus mode");
        if (options.thpracLocale != null && !["zh-CN", "ja-JP", "en-US"].includes(options.thpracLocale)) throw new Error("invalid thprac locale");
        if (options.oggDecodeMode != null && !["stream", "full"].includes(options.oggDecodeMode)) throw new Error("invalid OGG decode mode");
        if (options.netplayUrl != null && (typeof options.netplayUrl !== "string" || options.netplayUrl.length > 511 || !/^wss?:\/\//.test(options.netplayUrl))) throw new Error("invalid netplay URL");
        if (options.netplayPlayer != null && (!Number.isInteger(options.netplayPlayer) || options.netplayPlayer < 0 || options.netplayPlayer > 2)) throw new Error("invalid netplay player");
        if (options.netplayPlayerCount != null && (!Number.isInteger(options.netplayPlayerCount) || options.netplayPlayerCount < 2 || options.netplayPlayerCount > 3)) throw new Error("invalid netplay player count");
        if (options.netplaySpectatorId != null && (typeof options.netplaySpectatorId !== "string" || !/^[A-Za-z0-9_-]{0,64}$/.test(options.netplaySpectatorId))) throw new Error("invalid spectator id");
        if (options.netplaySpectatorCount != null && (!Number.isInteger(options.netplaySpectatorCount) || options.netplaySpectatorCount < 0 || options.netplaySpectatorCount > 64)) throw new Error("invalid spectator count");
        if (options.netplayMode != null && options.netplayMode !== "lan") throw new Error("invalid netplay mode");
        if (options.netplayInputDelayFrames != null && (!Number.isInteger(options.netplayInputDelayFrames) || options.netplayInputDelayFrames < 0 || options.netplayInputDelayFrames > 12)) throw new Error("invalid netplay input delay");
        if (options.netplayRollbackPolicy != null && !["full", "buffered"].includes(options.netplayRollbackPolicy)) throw new Error("invalid netplay rollback policy");
        if (!netplayDiagnostics && options.netplayInputDelayFrames != null && options.netplayInputDelayFrames !== 0) throw new Error("input delay is diagnostic-only");
        if (!netplayDiagnostics && options.netplayRollbackPolicy != null && options.netplayRollbackPolicy !== "full") throw new Error("buffered rollback is diagnostic-only");
        if (options.netplayMaxPredictionFrames != null && (!Number.isInteger(options.netplayMaxPredictionFrames) || options.netplayMaxPredictionFrames < 1 || options.netplayMaxPredictionFrames > 12)) throw new Error("invalid netplay prediction window");
        if (options.netplayTouchDeltaPredictionFrames != null && (!Number.isInteger(options.netplayTouchDeltaPredictionFrames) || options.netplayTouchDeltaPredictionFrames < 0 || options.netplayTouchDeltaPredictionFrames > 6)) throw new Error("invalid netplay touch delta prediction window");
        if (options.netplayTouchQuantization != null && (!Number.isFinite(options.netplayTouchQuantization) || options.netplayTouchQuantization < 0 || options.netplayTouchQuantization > 2)) throw new Error("invalid netplay touch quantization");
        if (options.netplayTouchEquivalentAbsorb != null && typeof options.netplayTouchEquivalentAbsorb !== "boolean") throw new Error("invalid netplay touch equivalence flag");
        if (options.netplayInitialFrameLag != null && (!Number.isInteger(options.netplayInitialFrameLag) || options.netplayInitialFrameLag < 0 || options.netplayInitialFrameLag > 8)) throw new Error("invalid initial frame lag");
        if (options.netplaySnapshotPolicy != null && !["always", "demand", "frontier"].includes(options.netplaySnapshotPolicy)) throw new Error("invalid netplay snapshot policy");
        if (options.netplaySnapshotRestore != null && !["sequential", "coalesced"].includes(options.netplaySnapshotRestore)) throw new Error("invalid netplay restore policy");
        if (options.netplaySnapshotCheckpointFrames != null && (!Number.isInteger(options.netplaySnapshotCheckpointFrames) || options.netplaySnapshotCheckpointFrames < 1 || options.netplaySnapshotCheckpointFrames > 8)) throw new Error("invalid netplay checkpoint span");
        if (options.netplayBulletSnapshot != null && !["journal", "compact", "live"].includes(options.netplayBulletSnapshot)) throw new Error("invalid netplay bullet snapshot mode");
        if (options.netplaySnapshotLayout != null && !["objects", "runs"].includes(options.netplaySnapshotLayout)) throw new Error("invalid snapshot layout");
        if (options.netplaySnapshotCopy != null && !["wasm", "bulk"].includes(options.netplaySnapshotCopy)) throw new Error("invalid snapshot copy");
        if (options.netplayPerfTelemetry != null && typeof options.netplayPerfTelemetry !== "boolean") throw new Error("invalid netplay telemetry");
