<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TH03</title>
<style>html,body{height:100%;margin:0;background:#000;color:#ddd;font:14px sans-serif}body{display:flex;align-items:center;justify-content:center;flex-direction:column}canvas{width:min(100vw,150vh);height:auto;image-rendering:pixelated;outline:none}#status{padding:8px}#status:empty{display:none}details{position:fixed;top:8px;right:8px;background:#222;padding:8px}label{display:block;padding:4px}</style></head>
<body><canvas id="game" width="640" height="400" tabindex="0" style="touch-action:none"></canvas><div id="status">加载中…</div><details><summary>设置</summary><label><input type="checkbox" id="rapid" checked>自动连射</label><label><input type="checkbox" id="focus" checked>低速（空格）</label><label><input type="checkbox" id="point" checked>低速时显示判定点</label><label><input type="checkbox" id="touch">触控</label><label><input type="checkbox" id="unlimited">触摸不限速移动</label></details><div id="touch-controls" hidden style="position:fixed;bottom:1em;right:1em;display:flex;gap:.5em;touch-action:none"><button data-touch="fire">射击</button><button data-touch="charge">蓄力</button><button data-touch="bomb">Bomb</button><button data-touch="focus">低速</button><button data-touch="pause">暂停</button></div><script src="/classic.js"></script><script type="module" src="/game.js"></script></body>
</html>
