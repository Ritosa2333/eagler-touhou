<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>东方星莲船 · 网页版</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><span class="eyebrow">UNDEFINED FANTASTIC OBJECT</span><h1>东方星莲船 <span>网页版</span></h1></div><span class="version">开发预览 0.3.0</span></header>
<main><section class="game-area"><div class="screen-wrap"><canvas id="screen" width="640" height="480" tabindex="0" aria-label="东方星莲船游戏画面"></canvas><div id="hud"><div id="score">000000000</div><div id="life">★★</div><div id="bombs">★★</div><div id="power">1.00</div><div id="graze">0</div></div><div id="overlay"><strong>春之凑</strong><span>选择机体，开始第一面</span></div></div><div class="game-bar"><span id="status" role="status">正在准备游戏资源…</span><span id="fps">—</span><button id="pause" disabled>暂停</button><button id="fullscreen">全屏</button></div><div id="replay-controls" hidden><label class="replay-position-label" for="replay-position"><span>录像位置</span><output id="replay-time">0:00.00 / 0:00.00</output></label><input id="replay-position" type="range" min="0" max="0" step="1" value="0" aria-label="拖动定位当前关卡录像"><div class="replay-actions"><button id="replay-back">后退 5 秒</button><button id="replay-forward">前进 5 秒</button><button id="replay-step">逐帧</button><span>松开进度条后跳转</span></div></div><div id="touch"><button data-bit="64">◀</button><button data-bit="16">▲</button><button data-bit="32">▼</button><button data-bit="128">▶</button><button data-bit="1">射击</button><button data-bit="8">低速</button><button data-bit="2">Bomb</button></div></section>
<aside><div class="panel"><h2>开始游戏</h2><label>自机<select id="character"><option value="0">博丽灵梦</option><option value="1">雾雨魔理沙</option><option value="2" selected>东风谷早苗</option></select></label><label>装备<select id="shot"><option value="0">A</option><option value="1" selected>B</option></select></label><label>难度<select id="difficulty"><option value="0">Easy</option><option value="1" selected>Normal</option><option value="2">Hard</option><option value="3">Lunatic</option><option value="4">Extra</option></select></label><label>关卡<select id="stage"><option value="1">第一面</option><option value="2">第二面</option><option value="3">第三面</option><option value="4">第四面</option><option value="5">第五面</option><option value="6">第六面</option><option value="7">Extra</option></select></label><button id="start" class="primary" disabled>开始</button><label class="check"><input id="music" type="checkbox" checked> 音乐与音效</label></div>
<div class="panel"><h2>原版录像预览</h2><select id="replay" aria-label="选择原版录像"></select><label>播放关卡<select id="replay-stage"></select></label><button id="play-replay" disabled>播放</button><label class="file-button">导入 .rpy<input id="import" type="file" accept=".rpy" disabled></label><div id="replay-info" class="subtle"></div></div>
<details class="panel"><summary>操作与检查</summary><p>当前开放各关卡试玩，画面与行为仍在对照原作。</p><p>方向键移动 · Z 射击 · Shift 低速 · X Bomb · Esc 暂停。触屏可使用下方按键，也可在画面上拖动。</p><button id="report">导出问题记录</button></details></aside></main>
<footer>原作、图像与音乐版权属于上海爱丽丝幻乐团。网页版移植开发预览。</footer>
<script type="module" src="/main.mjs"></script></body></html>
