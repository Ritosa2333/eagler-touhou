<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兽王园 · 录像回放</title>
<style>body{margin:0;background:#10121a;color:#eee;font:16px system-ui}main{max-width:1100px;margin:auto;padding:16px}header,nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:21px}iframe{width:100%;height:72vh;border:0;background:#000}button,select{font:inherit;padding:7px}input[type=range]{flex:1;min-width:180px}#status{min-height:26px;color:#bcd}label{cursor:pointer}#error{color:#ffaaaa;white-space:pre-wrap}</style>
<main><header><h1>兽王园 · 录像回放</h1><label>选择 .rpy <input id="file" type="file" accept=".rpy"></label></header><p id="status">正在准备播放器……</p><p id="error" role="alert"></p><div id="screen"></div><nav><button id="play" disabled>播放</button><button id="pause" disabled>暂停</button><button id="restart" disabled>从头播放</button><select id="rate" aria-label="速度" disabled><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select><input id="seek" aria-label="回放进度" type="range" min="0" max="0" value="0" disabled><span id="position">0 / 0</span></nav><p>使用录像录制时的网页版本播放。此窗口不会启动原版 EXE。</p></main><script type="module" src="viewer.mjs"></script></html>
